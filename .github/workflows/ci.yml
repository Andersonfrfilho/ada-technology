#
# Portao de qualidade antes do deploy. Os gatilhos do Railway estao com "wait for CI" ligado, entao
# o resultado deste workflow decide se `main` sobe para producao e `staging` para o ambiente de
# teste. Sem filtro de path de proposito: gatilho que espera por um check que nunca roda trava.

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Mesma versao do runtime em producao; divergir aqui esconde erro que so aparece no deploy.
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Testes
        run: bun run test

      # O Railway tambem quebraria numa build ruim, mas dez minutos depois e ja com o deploy em
      # andamento. Aqui quebra antes, em trinta segundos.
      - name: Build dos frontends
        run: |
          bun run --cwd apps/frontend-panel build
          bun run --cwd apps/frontend-site build

  # A quebra que derrubou producao nao aparecia em typecheck nem em teste: as migrations dos
  # modulos so rodam contra um banco de verdade, e um pacote publicado sem o simbolo que ele
  # mesmo importa so estoura no import em runtime. Este job e o unico lugar que exercita isso.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        # Mesmas credenciais de `envs/env.test`, para o migrate rodar sem override de variavel.
        env:
          POSTGRES_USER: ada
          POSTGRES_PASSWORD: ada
          POSTGRES_DB: ada_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ada -d ada_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Migrations em banco limpo
        working-directory: apps/api-ada
        run: bun run --env-file=../../envs/env.test src/infra/database/migrate.ts

      # Rodar de novo tem que ser inofensivo: migration nao idempotente quebra o deploy no segundo
      # release, nao no primeiro, que e quando ninguem esta olhando.
      - name: Migrations de novo, sobre o banco ja migrado
        working-directory: apps/api-ada
        run: bun run --env-file=../../envs/env.test src/infra/database/migrate.ts
