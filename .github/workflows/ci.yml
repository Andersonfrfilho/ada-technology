#
# Portao de qualidade antes do deploy. Os gatilhos do Railway estao com "wait for CI" ligado, entao
# o resultado deste workflow decide se `main` sobe para producao e `staging` para o ambiente de
# teste. Sem filtro de path de proposito: gatilho que espera por um check que nunca roda trava.

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Mesma versao do runtime em producao; divergir aqui esconde erro que so aparece no deploy.
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Testes
        run: bun run test

      # O Railway tambem quebraria numa build ruim, mas dez minutos depois e ja com o deploy em
      # andamento. Aqui quebra antes, em trinta segundos.
      - name: Build dos frontends
        run: |
          bun run --cwd apps/frontend-panel build
          bun run --cwd apps/frontend-site build
