name: ${PROJECT_NAME:-ada}-${ENV:-dev}

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME:-ada}-${ENV:-dev}-postgres
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ada
      POSTGRES_DB: ada_dev
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ada -d ada_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-ada}-${ENV:-dev}-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mock da Graph API da Meta — o WhatsApp Cloud API nao tem sandbox estavel.
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: ${PROJECT_NAME:-ada}-${ENV:-dev}-wiremock
    ports:
      - '8080:8080'
    volumes:
      - ./wiremock:/home/wiremock:ro
    command: ['--global-response-templating', '--verbose']

  # Bucket S3-compativel local. Em producao e um servico equivalente no Railway; a aplicacao so
  # conhece endpoint e credencial, entao trocar de provedor nao toca em codigo.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${PROJECT_NAME:-ada}-${ENV:-dev}-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ada
      MINIO_ROOT_PASSWORD: ada-local-dev
    ports:
      - '9004:9000'
      - '9005:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket e libera leitura anonima: a Meta busca a imagem do produto por URL publica, sem
  # credencial nossa. Sobe, configura e sai.
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${PROJECT_NAME:-ada}-${ENV:-dev}-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ada ada-local-dev
        mc mb --ignore-existing local/ada-products
        mc anonymous set download local/ada-products

volumes:
  postgres-data:
  redis-data:
  minio-data:
