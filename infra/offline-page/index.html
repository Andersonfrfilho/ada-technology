<style>
  /* Layout: cartão único centrado sobre fundo claro da marca; logo com a plaquinha 🚧 sobreposta no canto inferior esquerdo. */
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --ink: #14214d;
    --ink-soft: #4b5878;
    --line: #dfe5ee;
    --brand: #14214d;
    --cyan: #1597d1;
    --caution: #f2b705;
    --caution-ink: #14214d;
    --font: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    gap: 16px;
  }
  .page :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .page {
    flex: 1;
    display: grid;
    place-items: center;
    min-width: 0;
  }
  .card {
    position: relative;
    width: min(100%, 30rem);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px 32px 32px;
    text-align: center;
    overflow: hidden;
  }

  .mark {
    position: relative;
    width: 128px;
    margin: 0 auto 20px;
  }
  .mark img { display: block; width: 100%; height: auto; }
  .sign {
    position: absolute;
    left: -26px;
    bottom: -8px;
    font-size: 36px;
    line-height: 1;
    background: none;
    filter: drop-shadow(0 2px 3px rgba(20, 33, 77, 0.3));
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.6rem, 5vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .env {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--brand);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 12px;
    margin-bottom: 16px;
    overflow-wrap: anywhere;
  }
  p { margin: 0 auto 12px; max-width: 26rem; color: var(--ink-soft); text-wrap: pretty; }
  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 10px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  footer img { height: 24px; width: auto; }
  footer a { color: var(--brand); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { border-bottom-color: var(--cyan); }
  @media (max-width: 420px) {
    .card { padding: 32px 20px 24px; }
  }
</style>
</head>
